name: Gradle CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build and smoketest (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x gradlew
          set -o pipefail
          xvfb-run --auto-servernum ./gradlew build --console=plain 2>&1 | tee build-ci.log
      - name: Build and smoketest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat build --console=plain 2>&1 | Tee-Object build-ci.log
          exit $LASTEXITCODE
      - name: Upload compiled modules
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: metabnf-${{ runner.os }}
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: diagnostics-${{ runner.os }}
          path: |
            build-ci.log
            build/mps-*/log/**
            build/mps-*/editor-log/**
            build/mps-*/editor-reports/**
            build/mps-*/project/**/*.mps
            build/mps-*/project/**/*.mpl
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
